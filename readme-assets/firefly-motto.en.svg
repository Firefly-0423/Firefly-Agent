<svg xmlns="http://www.w3.org/2000/svg" width="720" height="44" viewBox="0 0 720 44" role="img" aria-labelledby="title desc"><title id="title">Talk with Firefly. Turn ideas into actions you can build on</title><desc id="desc">Three original lines fade over twelve seconds; the first remains without animation.</desc><rect width="720" height="44" fill="#0d1117"/><path d="M0 .5H720M0 43.5H720" stroke="#273138"/><text x="15" y="28" font-family="Consolas,monospace" font-size="14" fill="#8dd9c0">&gt;</text><g font-family="Microsoft YaHei,PingFang SC,Segoe UI,sans-serif" font-size="13" fill="#b7c9c3"><text x="34" y="28" opacity="1">Talk with Firefly. Turn ideas into actions you can build on.<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.27;.32;.59;.65;.97;1" dur="12s" repeatCount="indefinite"/></text><text x="34" y="28" opacity="0">Keep your preferences. Keep a trace of each step.<animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.32;.37;.59;.65;.97;1" dur="12s" repeatCount="indefinite"/></text><text x="34" y="28" opacity="0">Start with a conversation. Move on to materials, tools, and projects.<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.32;.37;.65;.70;.95;1" dur="12s" repeatCount="indefinite"/></text></g></svg>