<svg xmlns="http://www.w3.org/2000/svg" width="720" height="44" viewBox="0 0 720 44" role="img" aria-labelledby="title desc"><title id="title">与流萤交流，把想法变成可继续的行动</title><desc id="desc">三句原创标语十二秒淡入淡出；无动画时保留第一句。</desc><rect width="720" height="44" fill="#0d1117"/><path d="M0 .5H720M0 43.5H720" stroke="#273138"/><text x="15" y="28" font-family="Consolas,monospace" font-size="14" fill="#8dd9c0">&gt;</text><g font-family="Microsoft YaHei,PingFang SC,Segoe UI,sans-serif" font-size="13" fill="#b7c9c3"><text x="34" y="28" opacity="1">与流萤交流，把想法变成可继续的行动。<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.27;.32;.59;.65;.97;1" dur="12s" repeatCount="indefinite"/></text><text x="34" y="28" opacity="0">让明确的偏好留下来，让每一步有迹可循。<animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.32;.37;.59;.65;.97;1" dur="12s" repeatCount="indefinite"/></text><text x="34" y="28" opacity="0">从一段对话开始，走向资料、工具与项目。<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.32;.37;.65;.70;.95;1" dur="12s" repeatCount="indefinite"/></text></g></svg>