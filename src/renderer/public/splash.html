<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firefly</title>
  <style>
    :root {
      --ink: #0f1513;
      --surface: #141c19;
      --line: #2a3a34;
      --text: #eef6f1;
      --muted: #9aaea4;
      --mint: #7bd8ae;
      --mint-deep: #3b9a76;
      --mint-soft: #a9ead0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* The window is transparent and larger than the card so the glow has room to breathe. */
    .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }

    .card {
      position: relative;
      width: 360px;
      padding: 44px 32px 34px;
      display: grid;
      justify-items: center;
      gap: 6px;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid var(--line);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(123, 216, 174, 0.16) 0%, transparent 62%),
        linear-gradient(180deg, var(--surface) 0%, var(--ink) 100%);
      box-shadow: 0 0 0 1px rgba(123, 216, 174, 0.06), 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 80px rgba(123, 216, 174, 0.12);
      animation: card-in 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    /* Portrait inside a slowly turning arc. */
    .portrait { position: relative; width: 128px; height: 128px; display: grid; place-items: center; margin-bottom: 18px; }
    .portrait::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 55%, var(--mint-deep) 72%, var(--mint) 88%, var(--mint-soft) 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
      animation: spin 2.4s linear infinite;
    }
    .portrait::after {
      content: "";
      position: absolute; inset: 6px;
      border-radius: 50%;
      border: 1px solid rgba(123, 216, 174, 0.18);
    }
    .portrait img {
      width: 104px; height: 104px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      animation: breathe 3.6s ease-in-out infinite;
    }

    .name { color: var(--text); font-size: 24px; font-weight: 650; letter-spacing: 0.04em; }
    .tag { color: var(--muted); font-size: 12.5px; letter-spacing: 0.08em; }

    .status { margin-top: 20px; color: var(--mint-soft); font-size: 13px; letter-spacing: 0.02em; }
    .status::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4, end) infinite; }

    .bar { position: relative; width: 100%; height: 3px; margin-top: 14px; overflow: hidden; border-radius: 999px; background: rgba(123, 216, 174, 0.12); }
    .bar::before {
      content: "";
      position: absolute; top: 0; bottom: 0; left: 0; width: 38%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--mint) 55%, var(--mint-soft));
      animation: sweep 1.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }

    /* Fireflies drifting up through the card. Position, size and timing come from per-element custom properties. */
    .fly {
      position: absolute;
      left: var(--x); bottom: -8px;
      width: var(--s); height: var(--s);
      border-radius: 50%;
      background: var(--mint-soft);
      box-shadow: 0 0 calc(var(--s) * 3) calc(var(--s) * 0.6) rgba(123, 216, 174, 0.55);
      opacity: 0;
      animation: drift var(--d) ease-in-out var(--t) infinite;
      pointer-events: none;
    }

    @keyframes card-in { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(263%); } }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
    @keyframes drift {
      0% { transform: translate(0, 0); opacity: 0; }
      15% { opacity: 1; }
      50% { transform: translate(var(--dx), -210px); opacity: 0.85; }
      100% { transform: translate(calc(var(--dx) * -0.6), -430px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .portrait::before, .portrait img, .bar::before, .status::after, .fly { animation: none; }
      .bar::before { width: 100%; opacity: 0.55; }
      .status::after { content: "..."; }
      .fly { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card" role="status" aria-live="polite">
      <i class="fly" style="--x: 12%; --s: 4px; --d: 5.2s; --t: 0s; --dx: 18px"></i>
      <i class="fly" style="--x: 26%; --s: 3px; --d: 6.4s; --t: 1.1s; --dx: -14px"></i>
      <i class="fly" style="--x: 41%; --s: 5px; --d: 5.8s; --t: 0.5s; --dx: 22px"></i>
      <i class="fly" style="--x: 58%; --s: 3px; --d: 7s; --t: 1.9s; --dx: -20px"></i>
      <i class="fly" style="--x: 72%; --s: 4px; --d: 5.5s; --t: 0.9s; --dx: 16px"></i>
      <i class="fly" style="--x: 86%; --s: 3px; --d: 6.8s; --t: 2.4s; --dx: -12px"></i>
      <i class="fly" style="--x: 34%; --s: 3px; --d: 6.1s; --t: 3s; --dx: 10px"></i>
      <i class="fly" style="--x: 64%; --s: 4px; --d: 5.9s; --t: 3.6s; --dx: -18px"></i>

      <div class="portrait"><img src="./avatars/firefly-avatar.png" alt="流萤" /></div>
      <div class="name">Firefly</div>
      <div class="tag">流萤 · 桌面 Agent</div>
      <div class="status">正在启动</div>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
