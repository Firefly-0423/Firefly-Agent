<!doctype html><html lang="zh-CN" data-ui-theme="pearl-white"
><head
>
  <meta charset="UTF-8"
>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"
>
  <title
>流萤 · 侧栏</title>
  <link rel="stylesheet" href="../ui/tokens.css"
>
  <link rel="stylesheet" href="../ui/fonts.css"
>
  <link rel="stylesheet" href="../ui/base.css"
>
  <link rel="stylesheet" href="./sidebar.css"
>
  <link rel="stylesheet" href="../ui/theme.css"
>
  <link rel="stylesheet" href="../ui/glow.css"
>
</head>
<body
>
  <div class="sidebar"
>
    <header class="sidebar__titlebar"
>
      <button type="button" title="置顶" id="pin-btn" class="sidebar__icon-btn" aria-label="置顶"
>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" viewBox="0 0 48 48" height="16" fill="none" aria-hidden="true"
><g clip-path="url(#pin-icon-clip)"
><path stroke-width="4" stroke-linejoin="round" stroke="currentColor" fill="none" d="M10.6963 17.5042C13.3347 14.8657 16.4701 14.9387 19.8781 16.8076L32.62 9.74509L31.8989 4.78683L43.2126 16.1005L38.2656 15.3907L31.1918 28.1214C32.9752 31.7589 33.1337 34.6647 30.4953 37.3032C30.4953 37.3032 26.235 33.0429 22.7171 29.525L6.44305 41.5564L18.4382 25.2461C14.9202 21.7281 10.6963 17.5042 10.6963 17.5042Z"
></path></g><defs
><clipPath id="pin-icon-clip"
><rect width="48" height="48" fill="currentColor"
></rect></clipPath></defs></svg>
      </button>
      <div class="sidebar__title"
>
        <span class="sidebar__name"
>流萤</span>
      </div>
      <div class="sidebar__titlebar-actions"
>
        <button type="button" title="最小化" id="min-btn" class="sidebar__winbtn" aria-label="最小化"
>
          <svg width="9" viewBox="0 0 9 2" height="2" aria-hidden="true"
><rect width="9" rx="1" height="2" fill="currentColor"
></rect></svg>
        </button>
        <button type="button" title="关闭" id="close-btn" class="sidebar__winbtn sidebar__winbtn--close" aria-label="关闭"
>
          <svg width="9" viewBox="0 0 9 9" height="9" aria-hidden="true"
>
            <line y2="7" y1="2" x2="7" x1="2" stroke-width="1.4" stroke-linecap="round" stroke="currentColor"
></line>
            <line y2="7" y1="2" x2="2" x1="7" stroke-width="1.4" stroke-linecap="round" stroke="currentColor"
></line>
          </svg>
        </button>
      </div>
    </header>

    <main class="sidebar__body"
>
      <section class="profile"
>
        <img src="/avatars/firefly-avatar.png" draggable="false" class="profile__avatar" alt="流萤"
>
        <div class="profile__name"
>流萤</div>
        <div class="profile__online"
>
          <span class="profile__dot" aria-hidden="true"
></span>
          <span id="online-status-label"
>在线</span>
        </div>
      </section>

      <hr class="sidebar__divider"
>

      <section class="panel-card model-card"
>
        <button type="button" title="打开聊天" id="open-chat-btn" class="model-switch-btn"
>
          <svg xmlns="http://www.w3.org/2000/svg" width="15" viewBox="0 0 48 48" height="15" fill="none" class="model-switch-btn__icon" aria-hidden="true"
><path stroke-width="4" stroke-linejoin="round" stroke="currentColor" fill="none" d="M10 14C10 11.7909 11.7909 10 14 10H34C36.2091 10 38 11.7909 38 14V28C38 30.2091 36.2091 32 34 32H22L14 40V32C11.7909 32 10 30.2091 10 28V14Z"
></path><circle r="2" fill="currentColor" cy="21" cx="17"
></circle><circle r="2" fill="currentColor" cy="21" cx="24"
></circle><circle r="2" fill="currentColor" cy="21" cx="31"
></circle></svg>
          <span
>打开聊天</span>
        </button>
        <button type="button" title="切换模型" id="model-switch-btn" class="model-switch-btn"
>
          <svg xmlns="http://www.w3.org/2000/svg" width="15" viewBox="0 0 48 48" height="15" fill="none" class="model-switch-btn__icon" aria-hidden="true"
><path stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" d="M42 8V24"
></path><path stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" d="M6 24L6 40"
></path><path stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke="currentColor" d="M42 24C42 14.0589 33.9411 6 24 6C18.9145 6 14.3216 8.10896 11.0481 11.5M6 24C6 33.9411 14.0589 42 24 42C28.8556 42 33.2622 40.0774 36.5 36.9519"
></path></svg>
          <span
>切换模型</span>
        </button>
      </section>

      <section class="panel-card action-card"
>
        <button type="button" title="打开设置" id="settings-btn" class="settings-btn"
>
          <svg xmlns="http://www.w3.org/2000/svg" width="15" viewBox="0 0 48 48" height="15" fill="none" class="settings-btn__icon" aria-hidden="true"
><path stroke-width="4" stroke-linejoin="round" stroke="currentColor" fill="none" d="M18.2838 43.1713C14.9327 42.1736 11.9498 40.3213 9.58787 37.867C10.469 36.8227 11 35.4734 11 34.0001C11 30.6864 8.31371 28.0001 5 28.0001C4.79955 28.0001 4.60139 28.01 4.40599 28.0292C4.13979 26.7277 4 25.3803 4 24.0001C4 21.9095 4.32077 19.8938 4.91579 17.9995C4.94381 17.9999 4.97188 18.0001 5 18.0001C8.31371 18.0001 11 15.3138 11 12.0001C11 11.0488 10.7786 10.1493 10.3846 9.35011C12.6975 7.1995 15.5205 5.59002 18.6521 4.72314C19.6444 6.66819 21.6667 8.00013 24 8.00013C26.3333 8.00013 28.3556 6.66819 29.3479 4.72314C32.4795 5.59002 35.3025 7.1995 37.6154 9.35011C37.2214 10.1493 37 11.0488 37 12.0001C37 15.3138 39.6863 18.0001 43 18.0001C43.0281 18.0001 43.0562 17.9999 43.0842 17.9995C43.6792 19.8938 44 21.9095 44 24.0001C44 25.3803 43.8602 26.7277 43.594 28.0292C43.3986 28.01 43.2005 28.0001 43 28.0001C39.6863 28.0001 37 30.6864 37 34.0001C37 35.4734 37.531 36.8227 38.4121 37.867C36.0502 40.3213 33.0673 42.1736 29.7162 43.1713C28.9428 40.752 26.676 39.0001 24 39.0001C21.324 39.0001 19.0572 40.752 18.2838 43.1713Z"
></path><path stroke-width="4" stroke-linejoin="round" stroke="currentColor" fill="none" d="M24 31C27.866 31 31 27.866 31 24C31 20.134 27.866 17 24 17C20.134 17 17 20.134 17 24C17 27.866 20.134 31 24 31Z"
></path></svg>
          <span class="settings-btn__text"
>设置</span>
        </button>
      </section>

      <hr class="sidebar__divider"
>

      <div class="sidebar__version"
><span data-app-version></span></div>
    </main>
  </div>
  <script type="module" src="./sidebar.ts"
></script>


</body></html>
