[package]
name = "firefly-screenshot"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-numerics = "0.3.1"

[dev-dependencies]
serial_test = "3.5.0"

[features]
# Enabled explicitly when packaging both history helpers; screenshot builds leave it off.
history-read = ["windows/Wdk_Foundation", "windows/Wdk_Storage_FileSystem", "windows/Wdk_System_SystemServices", "windows/Win32_Security", "windows/Win32_System_IO"]
workspace-handle = ["history-read"]

[[bin]]
name = "firefly-history-read"
path = "src/bin/firefly-history-read.rs"
required-features = ["history-read"]

[[bin]]
name = "firefly-workspace"
path = "src/bin/firefly-workspace.rs"
required-features = ["workspace-handle"]

[[bin]]
name = "firefly-history-presence"
path = "src/bin/firefly-history-presence.rs"
required-features = ["history-read"]
