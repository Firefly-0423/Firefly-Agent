name: 运行时 Bug 🐛
description: 应用运行中的功能异常、偶现问题、崩溃等
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes: {value: 请提供触发条件和操作过程；偶发问题请说明频率。安装或构建失败请使用安装/构建表单。}
  - type: input
    id: app-version
    attributes: {label: Firefly 版本, description: 填写设置或关于页面中的版本号, placeholder: v1.x.x}
    validations: {required: true}
  - type: dropdown
    id: os
    attributes: {label: 运行系统, options: [Windows 11, Windows 10]}
    validations: {required: true}
  - type: dropdown
    id: install-source
    attributes: {label: 运行来源, options: [仓库源码（git clone + npm ci / npm run dev）, 本地解包产物（release/win-unpacked）, 不确定 / 其他]}
    validations: {required: true}
  - type: dropdown
    id: mode
    attributes: {label: 发生问题的模式, multiple: true, options: [chat（聊天）, work（工作）, learn（学习）, code（编程）, 不确定 / 其他入口（渠道、定时任务等）]}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: 如何触发, description: 按顺序列出操作；偶发问题可描述触发场景}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: 观察到的结果, description: 说明发生了什么以及是否出现错误提示}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 期望的结果, description: 说明你希望发生什么}
    validations: {required: false}
  - type: textarea
    id: logs
    attributes: {label: 日志或截图, description: 可附错误截图及 %APPDATA%/Firefly/logs/ 中的相关片段；提交前移除密钥和私人信息}
    validations: {required: false}
  - type: input
    id: frequency
    attributes: {label: 发生频率, description: 说明必现或估计的偶发比例, placeholder: 必现 / 偶现（约 N 次出 1 次）}
    validations: {required: false}
