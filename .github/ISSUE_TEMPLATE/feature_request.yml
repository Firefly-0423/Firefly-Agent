name: 功能请求 ✨
description: 提议一个新功能或改进
labels:
  - enhancement
body:
  - type: markdown
    attributes: {value: 请先搜索已有 Issue。涉及架构、权限或行为调整时请说明动机与场景。}
  - type: textarea
    id: problem
    attributes: {label: 使用场景与困难, description: 说明遇到的问题及发生场景}
    validations: {required: true}
  - type: textarea
    id: solution
    attributes: {label: 希望如何解决, description: 描述期望的行为和交互}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: 其他可行办法, description: 说明考虑过的其他方案及取舍}
    validations: {required: false}
  - type: dropdown
    id: area
    attributes: {label: 涉及的产品部分, multiple: true, options: [对话 / Agent, 工具 / 技能 / 插件, 界面 / 交互, 渠道接入（QQ、微信等）, 语音（TTS / ASR / 通话）, Live2D / 外观, 其他]}
    validations: {required: true}
