name: 安装/构建问题 🔧
description: npm install / npm run build 等环境与构建失败
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes: {value: 构建需要 Node.js 24 LTS 和 Electron 43。运行问题请使用运行时问题表单。}
  - type: dropdown
    id: os
    attributes: {label: 构建所在系统, options: [Windows 11, Windows 10, macOS (unsupported), Linux (unsupported)]}
    validations: {required: true}
  - type: input
    id: node-version
    attributes: {label: Node.js 版本号, description: 填写 node --version 的结果, placeholder: v24.x.x}
    validations: {required: true}
  - type: input
    id: npm-version
    attributes: {label: npm 版本号, description: 填写 npm --version 的结果, placeholder: 11.x.x}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: 执行过程, description: 按顺序列出复现命令和操作}
    validations: {required: true}
  - type: textarea
    id: error
    attributes: {label: 失败日志, description: 提供错误上下文；可附安装日志末尾约 50 行}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 预期与实际结果, description: 描述期望结果和实际结果}
    validations: {required: false}
  - type: textarea
    id: screenshots
    attributes: {label: 相关截图, description: 有截图时请附上}
    validations: {required: false}
