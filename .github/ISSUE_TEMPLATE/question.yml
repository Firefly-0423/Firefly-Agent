name: 使用咨询 ❓
description: 不知道某个功能怎么用、找不到入口、配置不明白——在这里问
labels:
  - question
body:
  - type: markdown
    attributes: {value: 可先查阅 README、设置和文档。运行错误请使用运行时问题表单，功能建议请使用功能请求表单。}
  - type: dropdown
    id: mode
    attributes: {label: 使用模式, options: [chat（聊天）, work（工作）, learn（学习）, code（编程）, 不确定 / 其他]}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes: {label: 相关功能区域, multiple: true, options: [对话 / Agent, 工具 / 技能 / 插件, 界面 / 交互, 渠道接入（QQ、微信等）, 语音（TTS / ASR / 通话）, Live2D / 外观, 设置 / 配置, 其他]}
    validations: {required: true}
  - type: input
    id: feature
    attributes: {label: 想了解的功能, description: 简要写出功能名称，例如定时任务或本地插件}
    validations: {required: true}
  - type: textarea
    id: goal
    attributes: {label: 目标, description: 说明希望完成的事情}
    validations: {required: true}
  - type: textarea
    id: tried
    attributes: {label: 已尝试的操作, description: 列出已查看的位置、操作和遇到的障碍}
    validations: {required: false}
  - type: textarea
    id: screenshots
    attributes: {label: 界面截图（如有）, description: 可附当前界面或设置页面}
    validations: {required: false}
