name: 架构讨论 🧠
description: 核心模块、依赖边界、API 设计方向——发起深度讨论
labels:
  - rfc
body:
  - type: markdown
    attributes: {value: 此表单用于讨论核心架构、依赖关系和接口。用户功能或界面建议请使用功能请求表单。}
  - type: dropdown
    id: area
    attributes: {label: 涉及的核心区域, multiple: true, options: [Agent / 对话引擎, 工具 / 技能, 插件系统, 渠道接入, 事件总线, 提示词 / 上下文, 渲染层 / UI, 持久化 / 配置, 构建 / 打包, 其他]}
    validations: {required: true}
  - type: input
    id: context
    attributes: {label: 相关模块或路径, description: 列出相关文件、模块或接口}
    validations: {required: false}
  - type: textarea
    id: problem
    attributes: {label: 现状与问题, description: 说明现有问题、修改动机及不修改的后果}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: 设计提案}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: 备选设计}
    validations: {required: false}
  - type: textarea
    id: impact
    attributes: {label: 影响与风险, description: 说明受影响的插件、渠道、数据迁移和回滚成本}
    validations: {required: false}
