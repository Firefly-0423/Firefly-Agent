updates:
  - directory: /
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 0
    package-ecosystem: npm
    schedule:
      day: monday
      interval: weekly
      timezone: Asia/Shanghai
  - directory: /
    open-pull-requests-limit: 0
    package-ecosystem: github-actions
    schedule:
      day: monday
      interval: weekly
      timezone: Asia/Shanghai
version: 2
