name: plugin-sdk

on:
  push:
    branches: [main, firefly-demo]
  pull_request:
    branches: [main, firefly-demo]

permissions:
  contents: read

# 同一分支上新提交到达后，旧提交还没跑完的运行没有意义，取消它们，释放运行器、减少偶发停顿的暴露面。
# push 与 pull_request 分开计组：二者各自保留，PR 上的必需检查不会被另一类事件的运行取消；main 上的每次推送都完整跑完。
concurrency:
  group: plugin-sdk-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先校验打包结果：Schema 与 vendored 契约须与源码一致，同时检查包内文件、内部路径以及两个入口能否加载
      - name: Build and verify SDK package
        run: pnpm run check:plugin-sdk

      # 再以打包产物（不是源码）编译 4 个示例插件，并做冒烟测试
      - name: Compile and smoke-test plugin examples
        run: pnpm run test:plugin-examples
