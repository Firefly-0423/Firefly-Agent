jobs:
  package:
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify Rust toolchain
        run: cargo --version
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Check tag matches package version
        run: |
          $tag = "${{ github.ref_name }}".Substring(1)
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "标签版本 v$tag 与 package.json 版本 $pkg 不一致"
            exit 1
          }
          Write-Host "标签与 package.json 版本一致：$pkg"
        shell: pwsh
      - name: Install dependencies
        run: npm ci --foreground-scripts
      - name: Verify Electron installation
        run: npx electron --version
      - name: Build NSIS installer
        run: npm run package:win
      - name: Verify installer artifacts
        run: npm run verify:installer
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: firefly-windows-installer
          path: |
            release/Firefly-Agent-Setup-*.exe
            release/latest.yml
          retention-days: 14
name: package-windows
'on':
  workflow_dispatch: null
permissions:
  contents: read
