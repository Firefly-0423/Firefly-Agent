name: package-windows

# Firefly_Agent 手动 Windows 安装包构建工作流：
# - package:win 与本地 package:win:dir 同样构建并校验截图、history helpers，
#   准备 MinGit，产出 NSIS 安装器并留存为工作流产物
# - --publish never：只构建不上传到 Releases；当前应用自动更新已禁用
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 原生辅助程序用 cargo --locked 构建；win25 运行器镜像自带 Rust 工具链
      - name: Verify Rust toolchain
        run: cargo --version

      # 标签构建先做版本一致性检查，避免产物与标签对不上还白跑十几分钟
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".Substring(1)
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "标签版本 v$tag 与 package.json 版本 $pkg 不一致"
            exit 1
          }
          Write-Host "标签与 package.json 版本一致：$pkg"

      - name: Install dependencies
        run: npm ci --foreground-scripts

      - name: Verify Electron installation
        run: npx electron --version

      # 统一入口构建应用、原生 helpers 与 MinGit，并校验随包 helper。
      - name: Build NSIS installer
        run: npm run package:win

      # 验证安装器、latest.yml 更新元数据与 win-unpacked 内随包二进制齐全
      - name: Verify installer artifacts
        run: npm run verify:installer

      # 留存为内部测试产物，不自动公开发布
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefly-windows-installer
          path: |
            release/Firefly_Agent-Setup-*.exe
            release/latest.yml
          if-no-files-found: error
          # 安装器数百 MB，缩短留存时间避免占满产物配额
          retention-days: 14
