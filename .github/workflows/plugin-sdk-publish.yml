name: plugin-sdk-publish

# 发布 @firefly_wu/plugin-sdk 到 npm：推送 plugin-sdk-v<版本> 标签时触发。
# 用 npm 可信发布（OIDC），仓库里不存放 npm 令牌；来源证明由 npm 自动生成。
# 首次发布与 npmjs.com 上的可信发布者设置见 docs/plugin-sdk-publishing.md。
on:
  push:
    tags: ["plugin-sdk-v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: plugin-sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # 可信发布需要 npm 11.5.1 以上
      - name: Check npm supports trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('npm '+process.argv[1]+' is older than 11.5.1');process.exit(1)}" "$(npm -v)"

      # 标签版本必须与 plugin-sdk/package.json 一致，避免发错版本
      - name: Check tag matches the SDK version
        run: |
          tag="${GITHUB_REF_NAME#plugin-sdk-v}"
          version="$(node -p "require('./plugin-sdk/package.json').version")"
          if [ "$tag" != "$version" ]; then echo "tag plugin-sdk-v$tag does not match plugin-sdk/package.json $version"; exit 1; fi

      - name: Install dependencies
        run: npm ci --foreground-scripts

      - name: Build and verify the SDK package
        run: npm run check:plugin-sdk

      - name: Compile and smoke-test plugin examples
        run: npm run test:plugin-examples

      - name: Publish to npm
        working-directory: plugin-sdk
        run: npm publish --access public
