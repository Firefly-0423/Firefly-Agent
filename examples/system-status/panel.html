<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firefly · 系统状态面板</title>
  <style>
    :root { font: 13px "Segoe UI", "Microsoft YaHei", sans-serif; color: #493942; }
    body { margin: 0; padding: 4px 0 8px; background: transparent; }
    dl { margin: 0; }
    .metric { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
    .metric + .metric { border-top: 1px solid rgba(243,220,230,.55); }
    dt { color: #9a8991; } dt::before { content: "●"; color: #ef78a9; margin-right: 7px; }
    dd { margin: 0; font-weight: 700; white-space: nowrap; }
    p { color: #b29fa8; font-size: 11px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <dl aria-label="系统状态">
    <div class="metric"><dt>CPU 占用</dt><dd id="cpu">—</dd></div>
    <div class="metric"><dt>内存占用</dt><dd id="memory">—</dd></div>
    <div class="metric"><dt>开机时长</dt><dd id="uptime">—</dd></div>
    <div class="metric"><dt>电池</dt><dd id="battery">—</dd></div>
  </dl>
  <p>通过插件快照通道获取数据，每 5 秒更新。</p>
  <script src="/.firefly/panel-bridge.js"></script>
  <script>
    const percent = value => value == null ? null : `${value}%`;
    function render(snapshot) {
      const values = {
        cpu: percent(snapshot.cpuPercent), memory: percent(snapshot.memoryPercent),
        uptime: snapshot.uptime,
        battery: snapshot.batteryPercent == null ? snapshot.batteryLabel : `${snapshot.batteryPercent}%（${snapshot.batteryLabel}）`,
      };
      for (const [id, value] of Object.entries(values)) {
        document.getElementById(id).textContent = value == null || value === "" ? "—" : String(value);
      }
    }
    async function poll() {
      try { render(await FireflyPanel.invoke("snapshot")); } catch { /* 下次轮询重试 */ }
    }
    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
