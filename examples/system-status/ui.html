<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firefly · 系统状态</title>
  <style>
    :root { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #4d3944; background: #fff6fa; }
    * { box-sizing: border-box; } body { margin: 0; }
    #titlebar { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #f9e5ef; -webkit-app-region: drag; }
    .controls { display: flex; gap: 4px; -webkit-app-region: no-drag; }
    button { border: 0; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; padding: 7px 10px; }
    button:hover { background: #edcadb; } main { max-width: 980px; margin: auto; padding: 24px; }
    header.intro { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .intro img { width: 78px; height: 78px; border-radius: 50%; object-fit: cover; }
    h1 { margin: 5px 0; font-size: 24px; } h2 { margin: 0 0 12px; font-size: 15px; }
    p { color: #8c7882; } .grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #f1dbe5; border-radius: 16px; padding: 18px; min-width: 0; }
    .wide { grid-column: span 2; } .full { grid-column: 1 / -1; }
    .value { font-size: 24px; font-weight: 700; } .detail { color: #907d87; margin-top: 6px; }
    .bar { background: #f7e8ef; height: 8px; border-radius: 10px; overflow: hidden; margin: 12px 0; }
    .fill { height: 100%; width: 0; background: #e978ac; } .disk-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; }
    .empty { color: #bbaab2; } footer { text-align: center; color: #9e8b94; font-size: 12px; margin-top: 18px; }
    @media(max-width:700px) { .grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media(max-width:420px) { main { padding: 14px; } .disk-row { grid-template-columns: 50px 1fr; } .disk-meta { grid-column: 2; } }
  </style>
</head>
<body>
  <header id="titlebar"><span>Firefly · 系统状态</span><div class="controls">
    <button id="btnMinimize" aria-label="最小化" title="最小化">─</button>
    <button id="btnMaximize" aria-label="最大化或还原" title="最大化 / 还原">□</button>
    <button id="btnClose" aria-label="关闭" title="关闭">✕</button>
  </div></header>
  <main aria-label="Firefly 系统状态面板">
    <header class="intro"><div><h1>今天也有好好运行哦♪</h1><p>查看电脑的实时状态。</p><p><span id="uptime">—</span> · <span id="cpuModel">—</span></p></div><img src="avatar.png" alt=""></header>
    <section class="grid" aria-label="系统指标">
      <article class="card wide"><h2>CPU 占用</h2><div id="cpuGauge"><span class="value" id="cpuValue">—</span><span id="cpuUnit">%</span></div><div class="detail">处理器负载</div></article>
      <article class="card wide"><h2>GPU 占用</h2><div id="gpuGauge"><span class="value" id="gpuValue">—</span><span id="gpuUnit">%</span></div><div class="detail">图形处理器负载</div></article>
      <article class="card wide"><h2>内存</h2><span class="value" id="memoryPercent">—</span><span id="memoryPercentUnit">%</span><div class="detail" id="memoryDetail">—</div><div class="bar" role="progressbar" aria-label="内存占用"><div class="fill" id="memoryBar"></div></div></article>
      <article class="card wide"><h2>磁盘空间 <small id="diskCount">—</small></h2><div id="diskList"></div></article>
      <article class="card"><h2>GPU 温度</h2><span id="gpuTemperature">—</span></article>
      <article class="card"><h2>显存</h2><span id="vram">—</span></article>
      <article class="card"><h2>网络</h2><span id="network">—</span></article>
      <article class="card"><h2>电池</h2><span id="battery">—</span></article>
    </section>
    <footer id="refreshHint">状态每 3 秒刷新</footer>
  </main>
  <script>
    const element = id => document.getElementById(id);
    const numeric = value => typeof value === "number" && Number.isFinite(value);
    const percentage = value => Math.round(Math.min(100, Math.max(0, value)));
    function show(id, value) {
      const node = element(id), empty = value == null || value === "";
      node.textContent = empty ? "—" : String(value);
      node.classList.toggle("empty", empty);
    }
    function gigabytes(value) { return Number.isInteger(value) ? String(value) : value.toFixed(1); }
    function sizePair(used, total) { return numeric(used) && numeric(total) ? `${gigabytes(used)} / ${gigabytes(total)} GB` : null; }
    function speed(value) {
      if (!numeric(value)) return null;
      if (value >= 1024 ** 2) return `${(value / 1024 ** 2).toFixed(1)} MB/s`;
      if (value >= 1024) return `${Math.round(value / 1024)} KB/s`;
      return `${Math.round(value)} B/s`;
    }
    function gauge(prefix, value) {
      const valid = numeric(value), number = valid ? percentage(value) : 0, node = element(`${prefix}Gauge`);
      node.style.setProperty("--value", number); node.classList.toggle("is-empty", !valid);
      show(`${prefix}Value`, valid ? number : null);
      element(`${prefix}Unit`).style.display = valid ? "inline" : "none";
      node.setAttribute("aria-label", valid ? `${number}%` : "暂无数据");
    }
    function disks(values) {
      const available = Array.isArray(values) && values.length > 0;
      show("diskCount", available ? `${values.length} 个分区` : null);
      const list = element("diskList"); list.replaceChildren();
      (available ? values : [null, null, null]).slice(0, 4).forEach((disk, index) => {
        const valid = disk && numeric(disk.percent), amount = valid ? percentage(disk.percent) : 0;
        const name = disk?.name || `${String.fromCharCode(67 + index)}:`;
        const row = document.createElement("div"); row.className = "disk-row";
        const title = document.createElement("span"); title.textContent = name;
        const bar = document.createElement("span"); bar.className = "bar"; bar.setAttribute("role", "progressbar"); bar.setAttribute("aria-label", `${disk?.name || "磁盘"}占用`);
        const fill = document.createElement("span"); fill.className = `fill${valid ? "" : " is-empty"}`; fill.style.display = "block"; fill.style.width = `${amount}%`; bar.appendChild(fill);
        const meta = document.createElement("span"); meta.className = "disk-meta";
        const sizes = disk ? sizePair(disk.usedGb, disk.totalGb) : null;
        meta.textContent = `${sizes ?? "—"} ${valid ? `${amount}%` : "—"}`;
        meta.classList.toggle("empty", !sizes && !valid); row.append(title, bar, meta); list.appendChild(row);
      });
    }
    window.renderSnapshot = function(snapshot = {}) {
      gauge("cpu", snapshot.cpuPercent); gauge("gpu", snapshot.gpuPercent);
      const valid = numeric(snapshot.memoryPercent), value = valid ? percentage(snapshot.memoryPercent) : 0;
      show("memoryPercent", valid ? value : null); element("memoryPercentUnit").style.display = valid ? "inline" : "none";
      element("memoryBar").style.width = `${value}%`; element("memoryBar").classList.toggle("is-empty", !valid);
      show("memoryDetail", sizePair(snapshot.memoryUsedGb, snapshot.memoryTotalGb)); disks(snapshot.disks);
      show("gpuTemperature", numeric(snapshot.gpuTemperature) ? `${Math.round(snapshot.gpuTemperature)} °C` : null);
      show("vram", sizePair(snapshot.vramUsedGb, snapshot.vramTotalGb)); show("network", speed(snapshot.networkBytesPerSecond));
      show("battery", numeric(snapshot.batteryPercent) ? `${percentage(snapshot.batteryPercent)}%` : snapshot.batteryLabel);
      show("uptime", snapshot.uptime); show("cpuModel", snapshot.cpuModel);
    };
    const { ipcRenderer } = require("electron");
    for (const [id, action] of [["btnMinimize", "win-minimize"], ["btnMaximize", "win-maximize"], ["btnClose", "win-close"]]) {
      element(id).addEventListener("click", () => ipcRenderer.send(`plugin:system-status:${action}`));
    }
    element("titlebar").addEventListener("dblclick", event => { if (!event.target.closest("button")) ipcRenderer.send("plugin:system-status:win-maximize"); });
    async function poll() { try { window.renderSnapshot(await ipcRenderer.invoke("plugin:system-status:snapshot")); } catch { /* 下次轮询重试 */ } }
    poll(); setInterval(poll, 3000);
  </script>
</body>
</html>
